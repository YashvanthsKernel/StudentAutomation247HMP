# ============================================================
# SonarQube Code Analysis - GitHub Actions Workflow
# Project: Student Automation System (Spring Boot + Maven)
# Organization: yashvanthskernel
# ============================================================

name: 🔍 SonarQube Code Analysis

on:
  push:
    branches:
      - dev
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write
  statuses: write

jobs:
  sonarqube-analysis:
    name: 🛡️ Build and Analyze
    runs-on: ubuntu-latest

    # ── PostgreSQL Service for Integration Tests ──────────────────────────────
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: student_automation_test
          POSTGRES_USER: ${{ secrets.DB_USERNAME }}
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # ── Step 1: Checkout Full History ──────────────────────────────────────
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history required for SonarQube blame analysis

      # ── Step 2: Setup JDK 21 ───────────────────────────────────────────────
      - name: ☕ Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # ── Step 3: Cache SonarQube Packages ───────────────────────────────────
      - name: 💾 Cache SonarQube Packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      # ── Step 4: Cache Maven Packages ───────────────────────────────────────
      - name: 💾 Cache Maven Packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      # ── Step 5: Make Maven Wrapper Executable ──────────────────────────────
      - name: 🔑 Make Maven Wrapper Executable
        run: chmod +x ./mvnw

      # ── Step 6: Build, Test & Analyze with SonarCloud ──────────────────────
      - name: 🔍 Build, Test and Analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          ./mvnw -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.projectKey=YashvanthsKernel_StudentAutomation247HMP \
            -Dsonar.organization=yashvanthskernel \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
            -Dspring.datasource.url=jdbc:postgresql://localhost:5432/student_automation_test \
            -Dspring.datasource.username=${{ secrets.DB_USERNAME }} \
            -Dspring.datasource.password=${{ secrets.DB_PASSWORD }} \
            -Dspring.jpa.hibernate.ddl-auto=create-drop \
            --no-transfer-progress

      # ── Step 7: Upload JaCoCo Coverage Report ──────────────────────────────
      - name: 📊 Upload Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-coverage-report
          path: target/site/jacoco/
          retention-days: 7
