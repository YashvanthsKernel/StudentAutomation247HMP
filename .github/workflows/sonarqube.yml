# ============================================================
# SonarQube Code Analysis - GitHub Actions Workflow
# Project: Student Automation System (Spring Boot + Maven)
# Triggers: Push to main/develop | Pull Requests to main
# ============================================================

name: 🔍 SonarQube Code Analysis

on:
  push:
    branches:
      - main
      - develop
      - dev
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - develop
      - dev

# Cancel redundant in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonarqube-analysis:
    name: 🛡️ SonarQube Analysis
    runs-on: ubuntu-latest

    # ── Service: PostgreSQL (needed if tests need DB) ──────────────────────
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: student_automation_test
          POSTGRES_USER: ${{ secrets.DB_USERNAME }}
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # ── Step 1: Checkout Full Git History (required for SonarQube blame) ──
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history → accurate line blame & new code detection

      # ── Step 2: Setup Java 21 (LTS) ────────────────────────────────────────
      - name: ☕ Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'   # Eclipse Temurin (recommended)
          cache: maven               # Cache Maven local repo for speed

      # ── Step 3: Cache SonarQube packages ───────────────────────────────────
      - name: 💾 Cache SonarQube Packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      # ── Step 4: Cache Maven Dependencies ───────────────────────────────────
      - name: 💾 Cache Maven Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven

      # ── Step 5: Build, Test & Generate JaCoCo Coverage Report ─────────────
      - name: 🏗️ Build & Run Tests with Coverage
        run: |
          ./mvnw verify \
            -Dspring.datasource.url=jdbc:postgresql://localhost:5432/student_automation_test \
            -Dspring.datasource.username=${{ secrets.DB_USERNAME }} \
            -Dspring.datasource.password=${{ secrets.DB_PASSWORD }} \
            -Dspring.jpa.hibernate.ddl-auto=create-drop \
            --batch-mode \
            --no-transfer-progress
        env:
          JAVA_OPTS: "-Xmx2g"

      # ── Step 6: Run SonarQube Analysis ─────────────────────────────────────
      - name: 🔍 Run SonarQube Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Enables PR decoration
        run: |
          ./mvnw sonar:sonar \
            -Dsonar.projectKey=student-automation \
            -Dsonar.projectName="Student Automation System" \
            -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }} \
            -Dsonar.java.coveragePlugin=jacoco \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
            -Dsonar.sources=src/main/java \
            -Dsonar.tests=src/test/java \
            -Dsonar.java.binaries=target/classes \
            -Dsonar.java.test.binaries=target/test-classes \
            -Dsonar.pullrequest.key=${{ github.event.pull_request.number }} \
            -Dsonar.pullrequest.branch=${{ github.head_ref }} \
            -Dsonar.pullrequest.base=${{ github.base_ref }} \
            --batch-mode \
            --no-transfer-progress

      # ── Step 7: Wait for Quality Gate Result ───────────────────────────────
      - name: ✅ Check SonarQube Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # ── Step 8: Upload JaCoCo Coverage Report as Artifact ──────────────────
      - name: 📊 Upload Coverage Report
        uses: actions/upload-artifact@v4
        if: always()   # Upload even if tests fail (for debugging)
        with:
          name: jacoco-coverage-report
          path: target/site/jacoco/
          retention-days: 7

      # ── Step 9: Publish Test Results Summary ───────────────────────────────
      - name: 📝 Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: |
            target/surefire-reports/**/*.xml
